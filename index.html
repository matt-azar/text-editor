<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Editor</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="app">
      <header id="titlebar">
        <svg class="brand" viewBox="0 0 64 64" aria-hidden="true" data-tauri-drag-region>
          <path fill="currentColor" d="M10 8h30l14 14v34H10z" />
          <path fill="#5c5c5c" d="M40 8v14h14z" />
        </svg>
        <nav id="menubar" aria-label="Application"></nav>
        <div class="drag" data-tauri-drag-region></div>
        <div class="controls">
          <button type="button" class="win" id="win-min" aria-label="Minimize">
            <svg viewBox="0 0 10 10" aria-hidden="true"><rect x="1" y="5" width="8" height="1" fill="currentColor" /></svg>
          </button>
          <button type="button" class="win" id="win-max" aria-label="Maximize">
            <svg viewBox="0 0 10 10" aria-hidden="true"><rect x="1.5" y="1.5" width="7" height="7" fill="none" stroke="currentColor" /></svg>
          </button>
          <button type="button" class="win close" id="win-close" aria-label="Close">
            <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 2l6 6M8 2L2 8" stroke="currentColor" stroke-width="1" /></svg>
          </button>
        </div>
      </header>
      <div id="tabs" hidden></div>
      <div id="empty">
        <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
          <path fill="currentColor" d="M12 6h26l14 14v38H12z" />
          <path fill="#4a4a4a" d="M38 6v14h14z" />
        </svg>
        <div class="shortcuts" id="shortcuts"></div>
      </div>
      <div id="editor" hidden></div>
      <footer id="status" hidden>
        <span id="status-path"></span>
        <span class="status-meta">
          <span id="status-pos"></span>
          <span>UTF-8</span>
          <span id="status-ending"></span>
        </span>
      </footer>
    </div>
    <div id="modal"></div>
  </body>
</html>
