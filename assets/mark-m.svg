<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" fill="rgb(88,95,105)"/>
  <!-- board -->
  <rect x="14" y="10" width="36" height="26" stroke="#ffffff" stroke-width="1.75" fill="none"/>
  <!-- tray -->
  <rect x="16" y="38" width="32" height="3.5" stroke="#ffffff" stroke-width="1.75" fill="none"/>
  <!-- posts -->
  <line x1="20" y1="41.5" x2="20" y2="52" stroke="#ffffff" stroke-width="1.75" stroke-linecap="square"/>
  <line x1="44" y1="41.5" x2="44" y2="52" stroke="#ffffff" stroke-width="1.75" stroke-linecap="square"/>
  <!-- feet -->
  <line x1="14" y1="52" x2="26" y2="52" stroke="#ffffff" stroke-width="1.75" stroke-linecap="square"/>
  <line x1="38" y1="52" x2="50" y2="52" stroke="#ffffff" stroke-width="1.75" stroke-linecap="square"/>
</svg>
